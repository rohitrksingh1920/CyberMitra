# HTTPS add-on. Use together with the main file (deploy/init-letsencrypt.sh does this for you):
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#
# It publishes port 443, gives nginx access to the certificates and adds a certbot service that
# renews them automatically (checks every 12 hours).
services:
  proxy:
    ports:
      - "443:443"
    volumes:
      - ./deploy/certbot-data/www:/var/www/certbot:ro
      - ./deploy/certbot-data/conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./deploy/certbot-data/www:/var/www/certbot
      - ./deploy/certbot-data/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
